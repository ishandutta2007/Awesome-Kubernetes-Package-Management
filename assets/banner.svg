<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Awesome Kubernetes Package Management</title>
  <desc id="bannerDesc">Animated banner: SaaS and open-source tools for Helm, GitOps and Kubernetes delivery, compared by price, free tier and stars</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1730">
        <animate attributeName="stop-color" values="#0a1730;#12294f;#0a1730" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f4fa8">
        <animate attributeName="stop-color" values="#1f4fa8;#3263d8;#1276c9;#1f4fa8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050d1f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050d1f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad7ff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7ad7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ad7ff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2fd18a"/>
      <stop offset="100%" stop-color="#8af0c4"/>
    </linearGradient>
  </defs>

  <!-- ===== BACKGROUND (all dynamic elements live beneath the title plate) ===== -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- pulsing grid -->
  <g stroke="#9fd0ff" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60">
      <animate attributeName="stroke-opacity" values="0.05;0.2;0.05" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="340" x2="1200" y2="340">
      <animate attributeName="stroke-opacity" values="0.2;0.05;0.2" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="0" x2="60" y2="400">
      <animate attributeName="stroke-opacity" values="0.05;0.18;0.05" dur="9s" repeatCount="indefinite"/>
    </line>
    <line x1="1140" y1="0" x2="1140" y2="400">
      <animate attributeName="stroke-opacity" values="0.18;0.05;0.18" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- GitOps flow line (dash carousel) -->
  <path d="M -120 96 C 180 46, 360 150, 600 96 S 1020 46, 1320 96" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 40">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0; 40 6; 0 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M -120 322 C 240 372, 420 268, 660 322 S 1080 372, 1320 322" fill="none" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="30 55" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="170" dur="6.5s" repeatCount="indefinite"/>
  </path>

  <!-- floating tool pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(170,300)">
      <rect x="0" y="0" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#9fd0ff" stroke-opacity="0.55"/>
      <text x="66" y="25" text-anchor="middle" fill="#e8f3ff">Helm ⚓</text>
      <animateTransform attributeName="transform" type="translate" values="170 300; 170 288; 170 300" dur="4.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(930,36)">
      <rect x="0" y="0" width="164" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#9fd0ff" stroke-opacity="0.55"/>
      <text x="82" y="25" text-anchor="middle" fill="#e8f3ff">Kustomize 🔧</text>
      <animateTransform attributeName="transform" type="translate" values="930 36; 930 48; 930 36" dur="5.5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(330,300)">
      <rect x="0" y="0" width="128" height="36" rx="18" fill="#2fd18a" fill-opacity="0.18" stroke="#2fd18a" stroke-opacity="0.7"/>
      <text x="64" y="24" text-anchor="middle" fill="#bcffe4">Argo CD 🚀</text>
      <animateTransform attributeName="transform" type="translate" values="330 300; 330 288; 330 300" dur="6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(856,298)">
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.14" stroke="#9fd0ff" stroke-opacity="0.55"/>
      <text x="60" y="24" text-anchor="middle" fill="#e8f3ff">Flux 🌊</text>
      <animateTransform attributeName="transform" type="translate" values="856 298; 856 310; 856 298" dur="5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(470,44)">
      <rect x="0" y="0" width="176" height="34" rx="17" fill="#ffffff" fill-opacity="0.12" stroke="#9fd0ff" stroke-opacity="0.45"/>
      <text x="88" y="23" text-anchor="middle" fill="#dceaff">GitOps Delivery 🔄</text>
      <animateTransform attributeName="transform" type="translate" values="470 44; 570 44; 470 44" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pulsing market bars -->
  <g fill="url(#barG)" opacity="0.85">
    <rect x="46" y="322" width="26" height="52" rx="6">
      <animate attributeName="height" values="52;30;52" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="322;344;322" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="300" width="26" height="74" rx="6">
      <animate attributeName="height" values="74;44;74" dur="4.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="300;330;300" dur="4.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="114" y="336" width="26" height="38" rx="6">
      <animate attributeName="height" values="38;66;38" dur="3.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="336;308;336" dur="3.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="1060" y="330" width="26" height="44" rx="6">
      <animate attributeName="height" values="44;70;44" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="330;304;330" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1094" y="308" width="26" height="66" rx="6">
      <animate attributeName="height" values="66;36;66" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="308;338;308" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1128" y="340" width="26" height="34" rx="6">
      <animate attributeName="height" values="34;58;34" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="340;316;340" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- slow orbiting helm-compass -->
  <g transform="translate(600,344)" opacity="0.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="18s" repeatCount="indefinite"/>
      <circle r="34" fill="none" stroke="#9fd0ff" stroke-width="3" stroke-dasharray="14 10"/>
      <circle cx="26" cy="0" r="5" fill="#9fd0ff"/>
      <circle r="7" fill="#9fd0ff"/>
    </g>
  </g>

  <!-- ===== FOREGROUND TITLE PLATE (drawn above all animations) ===== -->
  <rect x="70" y="118" width="1060" height="164" rx="24" fill="url(#glass)" stroke="#9fd0ff" stroke-opacity="0.45" stroke-width="1.5"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text id="title-text" x="600" y="196" font-size="54" font-weight="800" fill="#ffffff" textLength="960" lengthAdjust="spacingAndGlyphs">Awesome Kubernetes Package Management</text>
    <text x="600" y="244" font-size="23" font-weight="500" fill="#b9d8ff" textLength="900" lengthAdjust="spacingAndGlyphs">SaaS &amp; open-source tools for Helm, GitOps &amp; delivery — compared by price, free tier &amp; stars</text>
  </g>
</svg>